---
name: Automation

on:
  schedule:
    # Every Friday at 7 AM JST
    - cron: "0 22 * * 4"
  workflow_dispatch:
    inputs:
      regex:
        description: "Repo names regex:"
        required: true
        default: "^(.*)$"
        type: string

defaults:
  run:
    shell: sh

env:
  REGEX_DEFAULT: "^(.*)$"
  GH_TOKEN: "${{ secrets.GH_TOKEN }}"

jobs:
  run-automation:
    name: Run automation
    runs-on: [ubuntu-latest]
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: "${{ secrets.GH_TOKEN }}"
          persist-credentials: "false"

      - name: Install mtoohey31/gh-foreach
        run: gh extension install mtoohey31/gh-foreach

      - name: Run pre-automation scripts
        run: ./pre.sh
        working-directory: src/global

      - name: Run automation scripts
        uses: pyTooling/Actions/with-post-step@5c6a1aec0bb5a0243ad0c6f98a8e1258c019e679 # v9.3.3
        env:
          INPUT_REGEX: "${{ github.event.inputs.regex || env.REGEX_DEFAULT }}"
        with:
          main: ${GITHUB_WORKSPACE}/src/global/main.sh "${INPUT_REGEX}"
          post: ${GITHUB_WORKSPACE}/src/global/post.sh
